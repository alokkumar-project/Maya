<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
          <img
    src="{{ url_for('static', filename='images/maya_logo.png') }}"
    class="brand-logo"
    alt="Maya Logo">

<span class="brand-name">Maya</span>
      </div>
      <button class="icon-btn" id="collapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      New chat
    </button>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" width="15" height="15" class="search-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search conversations" autocomplete="off">
    </div>

    <div class="history-label">Recent</div>
    <nav class="history-list" id="historyList" aria-label="Chat history"></nav>

    <div class="sidebar-bottom">
      <div class="status-row" id="statusRow">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking model…</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="chat-header">
      <button class="icon-btn mobile-only" id="openSidebarBtn" title="Show history" aria-label="Show history">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="chat-title" id="chatTitle">New conversation</div>

      <div class="decode-toggle" id="decodeToggle" role="group" aria-label="Decoding strategy">
        <button type="button" class="decode-option active" data-mode="beam">Beam</button>
        <button type="button" class="decode-option" data-mode="greedy">Greedy</button>
        <span class="decode-slider" id="decodeSlider"></span>
      </div>

      <button class="icon-btn" id="downloadBtn" title="Download conversation" aria-label="Download conversation">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="renameBtn" title="Rename conversation" aria-label="Rename conversation">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="34" height="34">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" fill="none" stroke="url(#g2)" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2.6" fill="url(#g2)"/>
            <defs>
              <linearGradient id="g2" x1="0" y1="0" x2="24" y2="24">
                <stop offset="0" stop-color="#5B8DEF"/>
                <stop offset="1" stop-color="#2F6FED"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h2>How can I help you today?</h2>
        <p>Type a message below to start the conversation.</p>
      </div>
    </section>

    <form class="composer" id="composerForm">
      <textarea id="messageInput" rows="1" placeholder="Message Maya…" autocomplete="off"></textarea>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12l16-8-6 8 6 8-16-8z" fill="currentColor"/></svg>
      </button>
    </form>
    <div class="composer-hint">Answers are generated by Maya may be inaccurate.</div>
  </main>
</div>

<template id="conversationRowTemplate">
  <button class="history-item" type="button">
    <svg viewBox="0 0 24 24" width="14" height="14" class="history-item-mark"><path d="M8 12h8M8 8h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3.5" y="4" width="17" height="16" rx="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    <span class="history-item-title"></span>
    <span class="history-item-actions">
      <span class="history-item-delete" title="Delete conversation" aria-label="Delete conversation">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0h10l-1 13H8L7 7z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
      </span>
    </span>
  </button>
</template>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
